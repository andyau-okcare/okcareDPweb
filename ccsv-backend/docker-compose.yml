services:
  ccsv-api:
    build: .
    container_name: ccsv-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST:?Set DB_HOST in the project .env file}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?Set DB_USER in the project .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
      DB_NAME: ${DB_NAME:-ccsv_system}
      BASIC_SETTINGS_KEY: ${BASIC_SETTINGS_KEY:-}
    ports:
      - "3000:3000"
